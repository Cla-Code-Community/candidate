version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10

  - package-ecosystem: "gomod"
    directory: "/scraper-go"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
      - "/front_admin"
      - "/scraper-go"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
